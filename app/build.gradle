apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

android {
    namespace 'com.canteenmanagment'
    compileSdk 36

    defaultConfig {
        applicationId "com.canteenmanagment"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 2
        versionName "1.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding = true
        dataBinding = true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation "com.airbnb.android:lottie:6.7.1"
    implementation 'com.google.android.gms:play-services-auth:21.3.0'

    // Firebase (BoM manages individual library versions)
    implementation platform('com.google.firebase:firebase-bom:34.15.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.firebaseui:firebase-ui-auth:9.1.1'

    implementation 'com.github.PreetJagani:Canteen-managment-admin:v1.13' //github api library

    //for bottom navigation bar
    implementation 'com.github.ismaeldivita:chip-navigation-bar:1.4.0'

    //for card view
    implementation 'com.google.android.material:material:1.13.0'

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"

    //glide to load image from url
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    implementation "com.daimajia.easing:library:2.4@aar"
    implementation "com.daimajia.androidanimations:library:2.4@aar"

    //to convert object to string
    implementation 'com.google.code.gson:gson:2.11.0'

    // Lifecycle components
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.1'

    //over scroll for recycler view
    implementation 'io.github.everythingme:overscroll-decor-android:1.1.1'

    //upi payment
    implementation 'dev.shreyaspatil.EasyUpiPayment:EasyUpiPayment:3.0.3'

    //animated fav button
    implementation 'com.github.jd-alexander:LikeButton:0.2.3'

    //qr code generator
    implementation 'com.github.androidmads:QRGenerator:1.0.5'
    implementation 'com.google.zxing:core:3.5.3'

}
